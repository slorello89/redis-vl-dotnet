name: nuget-release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    services:
      redis:
        # Pinned to the documented minimum (Redis 8.4+ for native FT.HYBRID) so release-gating tests
        # run against a fixed, reproducible server rather than a drifting `latest`. Bump deliberately.
        image: redis:8.4.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      REDIS_VL_REDIS_URL: localhost:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore solution
        run: dotnet restore redis-vl-dotnet.sln

      - name: Build solution
        run: dotnet build redis-vl-dotnet.sln --configuration Release --no-restore

      - name: Test solution
        # Run each target framework's test host sequentially (the test project multi-targets
        # net8.0/net9.0/net10.0); concurrent runs against the shared Redis service flake.
        # Emit a TRX per leg so the execution-floor guard below can confirm the integration suite ran.
        run: |
          mkdir -p "${{ runner.temp }}/test-results"
          for tfm in net8.0 net9.0 net10.0; do
            echo "::group::Test $tfm"
            dotnet test redis-vl-dotnet.sln --configuration Release --no-build --framework "$tfm" \
              --verbosity normal \
              --logger "trx;LogFileName=${tfm}.trx" \
              --results-directory "${{ runner.temp }}/test-results"
            echo "::endgroup::"
          done

      - name: Enforce test execution floor
        # Gate the release on the integration suite actually running. `executed` (TRX counters)
        # excludes skipped tests, so it collapses if the ~75 integration tests silently skip
        # (e.g. a broken Redis service). A green-but-skipped run must not ship a release.
        shell: bash
        env:
          MIN_EXECUTED_TESTS: "400"
        run: |
          shopt -s nullglob
          trx_files=("${{ runner.temp }}"/test-results/*.trx)
          if [ ${#trx_files[@]} -eq 0 ]; then
            echo "::error::No TRX result files were produced; the test run did not complete." >&2
            exit 1
          fi
          status=0
          for trx in "${trx_files[@]}"; do
            executed=$(grep -oE 'executed="[0-9]+"' "$trx" | head -1 | grep -oE '[0-9]+')
            echo "$(basename "$trx"): executed=${executed:-0} (floor=$MIN_EXECUTED_TESTS)"
            if [ -z "$executed" ] || [ "$executed" -lt "$MIN_EXECUTED_TESTS" ]; then
              echo "::error::$(basename "$trx") executed ${executed:-0} tests, below the floor of $MIN_EXECUTED_TESTS. Integration tests may have been silently skipped." >&2
              status=1
            fi
          done
          exit $status

      - name: Pack publishable projects
        # Packs every project with <IsPackable>true</IsPackable> (see Directory.Build.props),
        # so new opt-in packages ship automatically without editing this workflow.
        run: dotnet pack redis-vl-dotnet.sln --configuration Release --no-build --output "${{ runner.temp }}/packages"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg

      - name: Publish packages to NuGet
        run: dotnet nuget push "${{ runner.temp }}/packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Read package version
        id: version
        shell: bash
        run: |
          # Evaluate the effective Version property so this keeps working regardless of which
          # file defines it (currently Directory.Build.props).
          version=$(dotnet msbuild src/RedisVL/RedisVL.csproj -getProperty:Version -nologo 2>/dev/null | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "Could not determine package version from the RedisVL project." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag release and create GitHub release
        # Runs only after a successful publish. Tags the built commit as v<version>
        # and creates a GitHub release. Safe to re-run: skips if the release already exists.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping tag and release creation."
            exit 0
          fi
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --title "$tag" \
            --generate-notes \
            "${{ runner.temp }}/packages/"*.nupkg
