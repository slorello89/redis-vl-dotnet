services:
  redis:
    # Pinned to the project's documented minimum (Redis 8.4+ for native FT.HYBRID) so integration
    # evidence is reproducible and does not drift as `latest` moves. Bump deliberately.
    image: redis:8.4.0
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
